<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" opacity="0.3" />
    </pattern>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .grid { fill: url(#tech-grid); }
    
    /* Dynamic Animations */
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -25px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-35px, 20px) scale(1.1); }
    }
    @keyframes pulsePulse {
      0%, 100% { opacity: 0.25; stroke-width: 1.5; }
      50% { opacity: 0.7; stroke-width: 2.5; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -120; }
    }

    .orb1 { animation: floatOrb1 10s ease-in-out infinite; transform-origin: 250px 100px; }
    .orb2 { animation: floatOrb2 12s ease-in-out infinite; transform-origin: 950px 240px; }
    
    .net-line { stroke: #6366f1; stroke-dasharray: 6 6; animation: dashTravel 4s linear infinite; }
    .net-line-2 { stroke: #38bdf8; stroke-dasharray: 8 8; animation: dashTravel 6s linear infinite; }
    
    .pulse-circle { animation: pulsePulse 4s ease-in-out infinite; }
    .node-dot { animation: pulseNode 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    /* Typography */
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -1.2px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" class="grid" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <g class="orb1">
    <circle cx="280" cy="110" r="160" fill="#3b82f6" filter="url(#glow-blur)" opacity="0.32" />
  </g>
  <g class="orb2">
    <circle cx="940" cy="220" r="180" fill="#a855f7" filter="url(#glow-blur)" opacity="0.28" />
  </g>

  <!-- Background Animated Network Mesh (Agent/Framework Synapses) -->
  <g opacity="0.45">
    <line x1="80" y1="280" x2="220" y2="200" class="net-line" stroke-width="1.8" />
    <line x1="220" y1="200" x2="350" y2="300" class="net-line-2" stroke-width="1.5" />
    <line x1="850" y1="70" x2="980" y2="140" class="net-line" stroke-width="1.5" />
    <line x1="980" y1="140" x2="1120" y2="90" class="net-line-2" stroke-width="1.8" />
    <line x1="980" y1="140" x2="1050" y2="270" class="net-line" stroke-width="1.5" />

    <!-- Network Pulsing Nodes -->
    <circle cx="220" cy="200" r="4.5" fill="#38bdf8" class="node-dot" />
    <circle cx="350" cy="300" r="4" fill="#818cf8" class="node-dot" style="animation-delay: 1s;" />
    <circle cx="980" cy="140" r="5" fill="#c084fc" class="node-dot" style="animation-delay: 1.5s;" />
    <circle cx="1050" cy="270" r="4.5" fill="#38bdf8" class="node-dot" style="animation-delay: 0.5s;" />

    <circle cx="220" cy="200" r="18" fill="none" stroke="#38bdf8" class="pulse-circle" />
    <circle cx="980" cy="140" r="22" fill="none" stroke="#c084fc" class="pulse-circle" style="animation-delay: 2s;" />
  </g>

  <!-- Content Pill Badge (Foreground) -->
  <g transform="translate(600, 72)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="-118" cy="0" r="5" fill="#10b981" />
    <text x="-102" y="5" fill="#cbd5e1" class="badge-text" text-anchor="start">AUTONOMOUS AGENTS &amp; RAG</text>
  </g>

  <!-- Main Title (Guaranteed in Clear Foreground) -->
  <text x="600" y="165" text-anchor="middle" class="title" fill="url(#text-grad)">Awesome AI Frameworks</text>

  <!-- Subtitle (Clear Foreground) -->
  <text x="600" y="218" text-anchor="middle" class="subtitle">The Production Landscape for Agent Orchestration, Workflows &amp; LLMOps</text>

  <!-- Floating Feature Chips (Foreground) -->
  <g transform="translate(600, 282)">
    <!-- Chip 1 -->
    <g transform="translate(-250, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="0" y="5" fill="#93c5fd" font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">⚡ Multi-Agent Teams</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="0" y="5" fill="#c4b5fd" font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">🧠 Production RAG</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(250, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="0" y="5" fill="#f472b6" font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" text-anchor="middle">📊 LLMOps &amp; Observability</text>
    </g>
  </g>
</svg>
